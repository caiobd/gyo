[project]
name = "gyo"
version = "0.1.0"
description = "RQ-based embedding-space inspection tool (Semantic IDs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pillow>=10",
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
    "timm>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "scipy>=1.18.0",
]

[project.scripts]
gyo = "gyo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gyo"]

[tool.pytest.ini_options]
markers = ["slow: requires model download / heavy compute"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=8",
]
